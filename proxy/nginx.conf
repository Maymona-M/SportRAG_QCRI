server {
    listen 80;
    server_name _;

    # Use docker embedded DNS for runtime resolution of service names
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Use variables so nginx resolves upstream at request time instead of at startup
    set $api_upstream "api:8000";
    # Production: serve the UI under the /sports/ base path.
    # Requests to /sports/api/ are proxied to the api service.
    location /sports/api/ {
        proxy_pass http://$api_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Support WebSocket upgrades for endpoints under /sports/ws/
    location /sports/ws/ {
        proxy_pass http://$api_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Serve the UI under /sports/ and forward remaining path to the UI service.
    # The UI image serves static files on port 80.
    set $ui_upstream "ui:80";
    location /sports/ {
        proxy_pass http://$ui_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
