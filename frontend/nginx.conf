server {
    listen 80;
    server_name _;

    # Serve static UI under /sports/
    location /sports/ {
        alias /usr/share/nginx/html/sports/;
        index index.html index.htm;
        try_files $uri $uri/ /sports/index.html;
    }

    # Optional: redirect root to /sports/
    location = / {
        return 302 /sports/;
    }

    # Don't expose directory listings
    location / {
        return 403;
    }
}
